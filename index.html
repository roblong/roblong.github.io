
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8eef2">
<title>Rob Long</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  padding: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, Helvetica, sans-serif;
  background: #e8eef2;
  color: #14263b;
}
.container {
  width: 100%;
  max-width: 590px;
}
.card {
  background: #ffffff;
  border-radius: 24px;
  padding: 48px;
  box-shadow: 0 16px 45px rgba(35, 60, 80, 0.06);
}
.name {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #273b50;
}
.intro {
  margin-top: 95px;
}
h1 {
  font-size: clamp(38px, 7vw, 54px);
  letter-spacing: -2px;
  line-height: 1.1;
  margin: 0 0 22px;
}
.description {
  font-size: 18px;
  line-height: 1.7;
  color: #53687c;
  max-width: 420px;
  margin: 0;
}
.contact {
  margin-top: 60px;
  padding-top: 26px;
  border-top: 1px solid #e1e8ee;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.contact-label {
  font-size: 11px;
  letter-spacing: 2px;
  color: #8a9aaa;
  margin-bottom: 8px;
}
.email {
  font-size: 17px;
  font-weight: 600;
  color: #315e87;
  text-decoration: none;
}
.email:hover {
  text-decoration: underline;
}
.arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #edf3f8;
  color: #315e87;
  font-size: 24px;
  text-decoration: none;
  transition: background 0.2s, transform 0.2s;
}
.arrow:hover {
  background: #dce9f3;
  transform: translate(2px, -2px);
}
footer {
  text-align: center;
  font-size: 12px;
  color: #8394a3;
  padding: 22px 0;
}
@media (max-width: 480px) {
  body {
    padding: 16px;
  }
  .card {
    padding: 32px 26px;
  }
  .intro {
    margin-top: 70px;
  }
  .contact {
    margin-top: 48px;
  }
  .email {
    font-size: 16px;
  }
}
</style>
</head>
<body>
  <div class="container">
    <main class="card">
      <div class="name">ROB LONG</div>
      <section class="intro">
        <h1>Hello, internet.</h1>
        <p class="description">
          I'm Rob. Welcome to my very small corner
          of a very large internet.
        </p>
      </section>
      <div class="contact">
        <div>
          <div class="contact-label">SAY HELLO</div>
          <a class="email" href="mailto:rob@roblong.net">
            rob@roblong.net
          </a>
        </div>
        <a class="arrow"
           href="mailto:rob@roblong.net"
           aria-label="Send Rob an email">
          &#8599;
        </a>
      </div>
    </main>
    <footer>
      Just a website. Nothing to subscribe to.
    </footer>
  </div>
</body>
</html>
